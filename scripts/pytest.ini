; Pytest config for the repo-level scripts (T-PLT-01). Run from the repo root:
;   pytest -c scripts/pytest.ini scripts/tests
; With -c the rootdir is scripts/, so `pythonpath = .` makes the scripts importable.
; `-p no:django`: these tests are stdlib-only and must not load pytest-django from the backend env.
; `-m "not gitleaks"`: the gitleaks tests need Docker; only the CI job `secrets` runs them, with
; `-m gitleaks` (a later -m on the command line replaces this one) (T-PLT-04).
[pytest]
addopts = -p no:django -m "not gitleaks"
pythonpath = .
testpaths = tests
markers =
    gitleaks: runs gitleaks in Docker with the image pinned in ci.yml (job secrets, AC-PLT-19)
