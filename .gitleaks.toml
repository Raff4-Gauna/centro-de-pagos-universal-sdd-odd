# gitleaks v8.30.1 (design.md sec. 3.6, RN-PLT-13, C-06). Read by the pre-commit hook (staged diff)
# and by the CI job `secrets` (commits of the PR or push).
# Default rules plus one own rule (Mercado Pago access tokens) and one allowlist: the
# `<ver .env: NAME>` placeholder that docs use instead of a real value. It is matched against the
# secret a rule captured (regexTarget = "secret"), never the whole line, so a real token next to a
# placeholder still fails. No path allowlist: every file is scanned, context/legacy-source/
# included (Q-055). Red zone (Q-058): a broad allowlist here silently turns the scan off.
title = "Centro de Pagos Universal"

[extend]
useDefault = true

# The default rules miss most Mercado Pago access tokens (APP_USR- in every form; TEST- in JSON,
# headers and query strings). Shape: PREFIX-<app id>-<MMDDHH>-<32 hex>-<user id>; the repo only
# documents the prefixes (context/03, context/09).
[[rules]]
id = "mercadopago-access-token"
description = "Mercado Pago access token (APP_USR- or TEST- credentials)"
regex = '''\b((?:APP_USR|TEST)-\d{12,20}-\d{6}-[0-9a-fA-F]{32}-\d{6,12})\b'''
secretGroup = 1
keywords = ["app_usr-", "test-"]

# Anchored: the captured secret must be the placeholder and nothing else. Unanchored, a multi-line
# secret (a private key) with a `<ver .env: X>` line inside would be allowed.
[[allowlists]]
description = "Doc placeholders <ver .env: NAME>, not secrets"
regexTarget = "secret"
regexes = ['''^<ver \.env: [A-Z][A-Z0-9_]*>$''']
