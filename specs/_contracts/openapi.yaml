openapi: 3.0.3
info:
  title: Centro de Pagos Universal API
  version: 0.18.0
paths:
  /api/auth/bff/login/complete/:
    post:
      operationId: auth_bff_login_complete
      description: Consume el intento de login (un solo uso, 10 minutos), canjea el
        código con Google, valida el ID token y abre la sesión. Los tokens son solo
        para el BFF.
      summary: Completa un login con Google (solo BFF)
      parameters:
      - in: header
        name: X-Hub-Client-UA
        schema:
          type: string
        description: User-Agent del navegador de la persona. Solo se guardan el navegador
          y el sistema operativo resumidos, nunca el valor completo.
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCompleteRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCompleteResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: google_auth_failed · login_cancelled · validation_error'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: email_not_verified · not_invited · user_inactive'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: identity_conflict'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: google_unavailable · login_disabled'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/login/start/:
    post:
      operationId: auth_bff_login_start
      description: Crea el intento de login y devuelve la URL de autorización de Google.
        Un return_path que no es una ruta interna se reemplaza por Inicio.
      summary: Inicia un login con Google (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStartRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStartResponse'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: login_disabled'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/logout/:
    post:
      operationId: auth_bff_logout
      description: Revoca la sesión que nombran el refresh token o el token de acceso,
        este aunque haya vencido. Responde 204 siempre, haya o no una sesión que cerrar.
      summary: Cierra la sesión (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - BffCredential: []
      responses:
        '204':
          description: Siempre, sin cuerpo.
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/refresh/:
    post:
      operationId: auth_bff_refresh
      description: 'Rota el refresh token y devuelve un token de acceso nuevo. Dentro
        de la ventana de gracia refresh_token es null: el BFF conserva la cookie que
        ya tiene.'
      summary: Refresca la sesión (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: token_invalid | session_revoked'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/:
    get:
      operationId: auth_sessions_list
      summary: Las sesiones activas de la persona autenticada
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/{session_id}/revoke/:
    post:
      operationId: auth_sessions_revoke
      summary: Cierra una sesión propia
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '204':
          description: La sesión quedó cerrada.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (también si la sesión es de otra persona o
            ya terminó)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/revoke-others/:
    post:
      operationId: auth_sessions_revoke_others
      summary: Cierra todas las sesiones propias salvo la actual
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '204':
          description: Solo queda activa la sesión actual.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/branches/:
    get:
      operationId: branches_list
      summary: Las sucursales de la organización activa
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: query
        name: is_active
        schema:
          enum:
          - 'false'
          - 'true'
          type: string
          minLength: 1
        description: |-
          true: solo las activas · false: solo las inactivas · sin el parámetro: todas.

          * `false` - false
          * `true` - true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: branches_create
      summary: Crea una sucursal en la organización activa
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
        required: true
      security:
      - HubBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (unknown_field si el cuerpo trae otra
            clave) · organization_required'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (rol sin permiso de gestión de sucursales)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: conflict (nombre o código de otra sucursal activa) ·
            organization_suspended'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_busy (otra operación tiene tomada la organización;
            no se escribió nada: se puede reenviar la misma request después de Retry-After:
            2 s)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/branches/{id}/:
    get:
      operationId: branches_retrieve
      summary: Una sucursal de la organización activa, activa o no
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: La sucursal.
        required: true
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (no existe o es de otra organización: el mismo
            cuerpo)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: branches_partial_update
      summary: Edita el nombre, el código o la dirección de una sucursal
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: La sucursal.
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdateRequest'
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (unknown_field si el cuerpo trae otra
            clave, como is_active u organization_id)'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (rol sin permiso de gestión de sucursales)'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (no existe o es de otra organización: el mismo
            cuerpo)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: conflict (nombre o código de otra sucursal activa) ·
            organization_suspended'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_busy (otra operación tiene tomada la organización;
            no se escribió nada: se puede reenviar la misma request después de Retry-After:
            2 s)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/branches/{id}/deactivate/:
    post:
      operationId: branches_deactivate
      summary: Desactiva una sucursal (no se borra nunca)
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: La sucursal.
        required: true
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (rol sin permiso de gestión de sucursales)'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (no existe o es de otra organización: el mismo
            cuerpo)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: invalid_transition (ya está en ese estado) · organization_suspended'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_busy (otra operación tiene tomada la organización;
            no se escribió nada: se puede reenviar la misma request después de Retry-After:
            2 s)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/branches/{id}/reactivate/:
    post:
      operationId: branches_reactivate
      summary: Reactiva una sucursal inactiva
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: La sucursal.
        required: true
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (taken: otra sucursal activa usa su
            nombre o su código)'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (rol sin permiso de gestión de sucursales)'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (no existe o es de otra organización: el mismo
            cuerpo)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: invalid_transition (ya está en ese estado) · organization_suspended'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_busy (otra operación tiene tomada la organización;
            no se escribió nada: se puede reenviar la misma request después de Retry-After:
            2 s)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/invitations/:
    get:
      operationId: invitations_list
      summary: Las invitaciones pendientes de la organización activa (owner y admin)
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationInvitationList'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (operator y viewer)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: invitations_create
      summary: Invitar a alguien a la organización activa (el link se muestra una
        sola vez)
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - HubBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (email inválido, rol desconocido u
            otra clave: unknown_field) · organization_required'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (el rol no alcanza: un admin no invita owners)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: already_member · invitation_pending (hay una vigente:
            reenviarla) · organization_suspended'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_busy (otra operación tiene tomada la organización;
            no se escribió nada: se puede reenviar la misma request después de Retry-After:
            2 s)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/invitations/{id}/resend/:
    post:
      operationId: invitations_resend
      summary: 'Reenviar una invitación: revoca la anterior y emite otra (link una
        sola vez)'
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: La invitación.
        required: true
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (el pedido no lleva cuerpo) · organization_required'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (el rol no alcanza: un admin no gestiona invitaciones
            owner)'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (no existe o es de otra organización: el mismo
            cuerpo) · organization_not_found'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: invalid_transition (no está pendiente) · organization_suspended'
        '503':
          content:
