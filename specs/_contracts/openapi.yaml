components:
  schemas:
    AcceptedInvitation:
      type: object
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/JoinedOrganization'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        membership_id:
          type: string
          format: uuid
          readOnly: true
      required:
      - membership_id
      - organization
      - role
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        deactivated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - address
      - code
      - deactivated_at
      - id
      - is_active
      - name
    BranchCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 255
      required:
      - name
    CreatedInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationStatusEnum'
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/InvitationPurposeEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/OrganizationMemberUser'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/TenancyActionEnum'
          readOnly: true
        accept_url:
          type: string
          readOnly: true
      required:
      - accept_url
      - allowed_actions
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - purpose
      - role
      - status
    CurrentOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        legal_name:
          type: string
          readOnly: true
        tax_id:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationStatusEnum'
          readOnly: true
        my_role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        my_membership_id:
          type: string
          format: uuid
          readOnly: true
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/TenancyActionEnum'
          readOnly: true
        invitable_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - allowed_actions
      - id
