          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
      required:
      - browser
      - created_at
      - id
      - is_current
      - last_used_at
      - os
    TenancyActionEnum:
      enum:
      - org.read
      - org.update
      - member.list
      - member.change_role
      - member.revoke
      - member.leave
      - invitation.list
      - invitation.create
      - invitation.resend
      - invitation.revoke
      - branch.read
      - branch.create
      - branch.update
      - branch.deactivate
      - branch.reactivate
      type: string
      description: |-
        * `org.read` - org.read
        * `org.update` - org.update
        * `member.list` - member.list
        * `member.change_role` - member.change_role
        * `member.revoke` - member.revoke
        * `member.leave` - member.leave
        * `invitation.list` - invitation.list
        * `invitation.create` - invitation.create
        * `invitation.resend` - invitation.resend
        * `invitation.revoke` - invitation.revoke
        * `branch.read` - branch.read
        * `branch.create` - branch.create
        * `branch.update` - branch.update
        * `branch.deactivate` - branch.deactivate
        * `branch.reactivate` - branch.reactivate
  securitySchemes:
    BffCredential:
      type: apiKey
      in: header
      name: X-Hub-Bff-Credential
      description: Solo el BFF. Sin ella, la ruta responde 404 not_found.
    HubBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
