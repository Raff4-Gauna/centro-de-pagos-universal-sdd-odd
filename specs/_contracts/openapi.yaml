openapi: 3.0.3
info:
  title: Centro de Pagos Universal API
  version: 0.12.0
paths:
  /api/auth/bff/login/complete/:
    post:
      operationId: auth_bff_login_complete
      description: Consume el intento de login (un solo uso, 10 minutos), canjea el
        código con Google, valida el ID token y abre la sesión. Los tokens son solo
        para el BFF.
      summary: Completa un login con Google (solo BFF)
      parameters:
      - in: header
        name: X-Hub-Client-UA
        schema:
          type: string
        description: User-Agent del navegador de la persona. Solo se guardan el navegador
          y el sistema operativo resumidos, nunca el valor completo.
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCompleteRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCompleteResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: google_auth_failed · login_cancelled · validation_error'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: email_not_verified · not_invited · user_inactive'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: identity_conflict'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: google_unavailable · login_disabled'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/login/start/:
    post:
      operationId: auth_bff_login_start
      description: Crea el intento de login y devuelve la URL de autorización de Google.
        Un return_path que no es una ruta interna se reemplaza por Inicio.
      summary: Inicia un login con Google (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStartRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStartResponse'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: login_disabled'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/logout/:
    post:
      operationId: auth_bff_logout
      description: Revoca la sesión que nombran el refresh token o el token de acceso,
        este aunque haya vencido. Responde 204 siempre, haya o no una sesión que cerrar.
      summary: Cierra la sesión (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - BffCredential: []
      responses:
        '204':
          description: Siempre, sin cuerpo.
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/bff/refresh/:
    post:
      operationId: auth_bff_refresh
      description: 'Rota el refresh token y devuelve un token de acceso nuevo. Dentro
        de la ventana de gracia refresh_token es null: el BFF conserva la cookie que
        ya tiene.'
      summary: Refresca la sesión (solo BFF)
      tags:
      - bff-internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - BffCredential: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: token_invalid | session_revoked'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: rate_limited (con Retry-After)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/:
    get:
      operationId: auth_sessions_list
      summary: Las sesiones activas de la persona autenticada
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/{session_id}/revoke/:
    post:
      operationId: auth_sessions_revoke
      summary: Cierra una sesión propia
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '204':
          description: La sesión quedó cerrada.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: not_found (también si la sesión es de otra persona o
            ya terminó)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/sessions/revoke-others/:
    post:
      operationId: auth_sessions_revoke_others
      summary: Cierra todas las sesiones propias salvo la actual
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '204':
          description: Solo queda activa la sesión actual.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/branches/:
    get:
      operationId: branches_list
      summary: Las sucursales de la organización activa
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      - in: query
        name: is_active
        schema:
          enum:
          - 'false'
          - 'true'
          type: string
          minLength: 1
        description: |-
          true: solo las activas · false: solo las inactivas · sin el parámetro: todas.

          * `false` - false
          * `true` - true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: branches_create
      summary: Crea una sucursal en la organización activa
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
        required: true
      security:
      - HubBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (unknown_field si el cuerpo trae otra
            clave) · organization_required'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: conflict (nombre o código de otra sucursal activa) ·
            organization_suspended'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/invitations/accept/:
    post:
      operationId: invitations_accept
      summary: Aceptar una invitación con su token (sin organización activa)
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: invitation_invalid, con reason: not_found · email_mismatch
            · revoked · used · expired; o validation_error (falta el token)'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_suspended · already_member'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/me/:
    get:
      operationId: me_retrieve
      summary: La persona autenticada y sus memberships activas
      tags:
      - identity
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/organizations/:
    get:
      operationId: organizations_list
      summary: Las organizaciones de la persona autenticada y su rol en cada una
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyOrganizationList'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/organizations/current/:
    get:
      operationId: organizations_current_retrieve
      summary: La organización activa y lo que la persona puede hacer en ella
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      tags:
      - tenancy
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganization'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_required (falta X-Organization-Id)'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_not_found (no existe o sin membership activa:
            el mismo cuerpo)'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: organizations_current_partial_update
      summary: Editar los datos de la organización activa (owner y admin)
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
          format: uuid
        description: Organización activa de la request (RN-TEN-03).
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdateRequest'
      security:
      - HubBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganization'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: validation_error (un campo desconocido o de solo lectura,
            como status, es unknown_field) · organization_required'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: unauthenticated · token_expired · token_invalid · session_revoked
            (con WWW-Authenticate: Bearer realm="hub")'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: forbidden (rol sin org.update)'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_not_found (no existe o sin membership activa:
            el mismo cuerpo)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'code: organization_suspended'
        4XX:
          description: Error del cliente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Error del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AcceptedInvitation:
      type: object
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/JoinedOrganization'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        membership_id:
          type: string
          format: uuid
          readOnly: true
      required:
      - membership_id
      - organization
      - role
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        deactivated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - address
      - code
      - deactivated_at
      - id
      - is_active
      - name
    BranchCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 255
      required:
      - name
    CurrentOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        legal_name:
          type: string
          readOnly: true
        tax_id:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationStatusEnum'
          readOnly: true
        my_role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        my_membership_id:
          type: string
          format: uuid
          readOnly: true
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/TenancyActionEnum'
          readOnly: true
        invitable_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - allowed_actions
      - id
      - invitable_roles
      - legal_name
      - my_membership_id
      - my_role
      - name
      - status
      - tax_id
      - timezone
    InvitationAcceptRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - token
    JoinedOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    LoginCompleteRequest:
      type: object
      properties:
        state:
          type: string
          maxLength: 512
        login_binding:
          nullable: true
          oneOf:
          - type: string
            maxLength: 43
            minLength: 43
          - type: string
            maxLength: 0
        code:
          type: string
          nullable: true
          maxLength: 2048
        error:
          type: string
          nullable: true
          maxLength: 256
      required:
      - state
    LoginCompleteResponse:
      type: object
      properties:
        access_token:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        session_id:
          type: string
          format: uuid
          readOnly: true
        session_expires_in:
          type: integer
          readOnly: true
        return_path:
          type: string
          readOnly: true
      required:
      - access_expires_in
      - access_token
      - refresh_token
      - return_path
      - session_expires_in
      - session_id
    LoginStartRequest:
      type: object
      properties:
        login_binding:
          type: string
          minLength: 43
          maxLength: 43
        return_path:
          type: string
          nullable: true
      required:
      - login_binding
    LoginStartResponse:
      type: object
      properties:
        authorization_url:
          type: string
          format: uri
          readOnly: true
      required:
      - authorization_url
    LogoutReasonEnum:
      enum:
      - logout
      - superseded
      type: string
      description: |-
        * `logout` - logout
        * `superseded` - superseded
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          nullable: true
        access_token:
          type: string
          nullable: true
        reason:
          $ref: '#/components/schemas/LogoutReasonEnum'
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          readOnly: true
      required:
      - avatar_url
      - display_name
      - email
      - id
      - memberships
    Membership:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - organization_id
      - organization_name
      - role
    MyOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationStatusEnum'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - id
      - name
      - role
      - status
    OrganizationStatusEnum:
      enum:
      - active
      - suspended
      type: string
      description: |-
        * `active` - active
        * `suspended` - suspended
    PaginatedBranchList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=4
        previous:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    PaginatedMyOrganizationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=4
        previous:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MyOrganization'
    PaginatedSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=4
        previous:
          type: string
          nullable: true
          description: Ruta relativa con la query de la página, o null.
          example: /api/recurso/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    PatchedOrganizationUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        legal_name:
          type: string
          maxLength: 200
        tax_id:
          type: string
          maxLength: 13
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    Problem:
      type: object
      description: Sobre único de error (RFC 9457), media type application/problem+json.
        Sin trazas, hosts ni secretos.
      properties:
        type:
          type: string
          example: urn:hub:problem:validation_error
        title:
          type: string
          description: Fijo para cada code.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: 'Estable: cambiar o borrar uno publicado es incompatible.'
          example: validation_error
        detail:
          type: string
          description: 'Nunca en un 5xx. Puede reflejar lo que envió el cliente: se
            muestra como texto plano, nunca se interpreta como HTML.'
        request_id:
          type: string
          nullable: true
          description: El mismo valor que el header X-Request-ID de la respuesta.
        errors:
          type: array
          description: Solo en validation_error.
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        reason:
          type: string
          description: 'Solo en los code que se precisan (invitation_invalid): un
            valor de una lista cerrada, nunca la entrada.'
          example: expired
      required:
      - type
      - title
      - status
      - code
      - request_id
    ProblemFieldError:
      type: object
      properties:
        field:
          type: string
          example: amount
        code:
          type: string
          example: required
        message:
          type: string
          description: 'Puede reflejar lo que envió el cliente: se muestra como texto
            plano, nunca se interpreta como HTML.'
      required:
      - field
      - code
      - message
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
          nullable: true
        session_expires_in:
          type: integer
          readOnly: true
      required:
      - access_expires_in
      - access_token
      - refresh_token
      - session_expires_in
    RoleEnum:
      enum:
      - owner
      - admin
      - operator
      - viewer
      type: string
      description: |-
        * `owner` - owner
        * `admin` - admin
        * `operator` - operator
        * `viewer` - viewer
    Session:
      type: object
      properties:
        id:
          type: string
