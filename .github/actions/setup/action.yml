# Shared job setup for ci.yml (design.md §3.5). Versions from design.md §8: uv 0.13.6, Python 3.12.16,
# Node 24.22.2 (frontend/.nvmrc), pnpm 12.16.1 (frontend/package.json `packageManager`).
# Input `python`: uv + Python + the backend env from the lockfile (dev group included), put on PATH.
# Input `node`: pnpm + Node + the frontend deps from the lockfile (pnpm install --frozen-lockfile).
name: setup
description: Install the pinned toolchain for a CI job.

inputs:
  python:
    description: "Install uv 0.13.6, Python 3.12.16 and the backend env (uv sync --frozen)."
    required: false
    default: "false"
  node:
    description: "Install pnpm 12.16.1, Node 24.22.2 and the frontend deps (pnpm install --frozen-lockfile)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Fail when no toolchain is requested
      if: inputs.python != 'true' && inputs.node != 'true'
      shell: bash
      run: |
        echo "::error::.github/actions/setup called without any toolchain input set to 'true'"
        exit 1

    - name: Set up uv
      if: inputs.python == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        # "auto": cache on GitHub-hosted runners, but not on tag pushes (release builds start clean).
        enable-cache: auto
        cache-dependency-glob: backend/uv.lock

    - name: Install Python 3.12.16
      if: inputs.python == 'true'
      shell: bash
      run: uv python install 3.12.16

    - name: Install the backend env from the lockfile
      if: inputs.python == 'true'
      shell: bash
      working-directory: backend
      # --frozen: install exactly uv.lock, never re-resolve (C-13, RN-PLT-14).
      run: uv sync --frozen --python 3.12.16

    - name: Put the backend env on PATH
      if: inputs.python == 'true'
      shell: bash
      run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # No `version`: it comes from `packageManager` (exact version + hash), the single source.
        package_json_file: frontend/package.json

    - name: Check pnpm matches packageManager
      if: inputs.node == 'true'
      shell: bash
      # pnpm/action-setup drops the `+sha512...` suffix of `packageManager`, so check that the pnpm
      # on PATH is exactly the pinned version (T-PLT-27 review follow-up, T-PLT-28).
      run: |
        expected="$(jq -r '.packageManager // ""' frontend/package.json | sed -E 's/^pnpm@([^+]+).*$/\1/')"
        actual="$(pnpm --version)"
        if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
          echo "::error::pnpm ${actual} does not match packageManager '${expected}' in frontend/package.json"
          exit 1
        fi
        echo "pnpm ${actual} matches packageManager"

    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: frontend/.nvmrc
        # No pnpm cache on tag pushes (release builds start clean, like `enable-cache: auto` of
        # setup-uv). The empty value goes last: `cond && '' || 'pnpm'` always yields 'pnpm'.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }}
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install the frontend deps from the lockfile
      if: inputs.node == 'true'
      shell: bash
      working-directory: frontend
      # --frozen-lockfile: install exactly pnpm-lock.yaml, never re-resolve (C-13, RN-PLT-14).
      run: pnpm install --frozen-lockfile
