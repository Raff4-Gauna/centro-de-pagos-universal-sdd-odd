# CI pipeline (design.md §3.5, RN-PLT-11, RN-PLT-18). Fail-fast chain through `needs:`:
#   lint -> file-size -> secrets + deps-audit -> typecheck -> architecture -> tests -> coverage
#   -> migrations -> build
# It grows one task at a time: each task inserts its job in its place and moves the `needs` of the
# next one (scripts/tests/test_AC_PLT_20_pipeline_chain.py checks the shape on every PR).
# Rules: never pull_request_target nor workflow_run; read-only token; no secrets; every remote
# `uses:` pinned by full SHA (tag in the comment); no job-level `if:` on a required job (a skipped
# required check counts as passed on GitHub).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs of a PR; never cancel a run on main or a tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Common, non-secret env (design.md §3.5). config.settings.test requires these variables (T-PLT-08);
# they are fixed test values, not secrets. DATABASE_URL/REDIS_URL point at the services of the
# `tests` job (T-PLT-11); DATABASE_URL also at the PostgreSQL of `migrations` (T-PLT-22). In the
# other jobs nothing connects to them.
env:
  TZ: UTC
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
  DATABASE_URL: postgres://hub:hub@localhost:5432/hub
  REDIS_URL: redis://localhost:6379/0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Step 1. ruff, eslint/prettier and AC-PLT-33 (RN-PLT-18): check_workflows.py fails on any rule
  # of the header above, in every workflow and local action, naming the file and the rule.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
          node: "true"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: eslint --max-warnings 0
        working-directory: frontend
        run: pnpm lint
      - name: prettier --check
        working-directory: frontend
        run: pnpm format:check
      - name: check_workflows.py
        run: python scripts/check_workflows.py

  # Step 2. AC-PLT-13: tracked code files over 400 lines (C-14).
  file-size:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: check_file_size.py
        run: python scripts/check_file_size.py

  # Step 3. AC-PLT-19 (RN-PLT-13, C-06): gitleaks over the commits of the event with the repo's
  # .gitleaks.toml, findings redacted. Image by tag + digest (multi-arch index, RN-PLT-14). Range:
  # base..head on a PR, before..after on a push; the whole history of `after` on the first push of
  # a ref (before = 40 zeros) or when `before` is not in the clone. fetch-depth 0 so every commit of
  # the range is there. Then the `gitleaks`-marked tests against the same image. deps-audit
  # (T-PLT-28) joins this stage.
  secrets:
    needs: file-size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      # Lockfiles the path guard lets through (Q-062), space-separated exact paths, one place for
      # both the guard and the stdin scan. Each new one is added here by hand and reviewed.
      GITLEAKS_EXEMPT_LOCKFILES: frontend/pnpm-lock.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Event values go through env, never into the script text. Only 40-hex SHAs reach
      # --log-opts (gitleaks splits it on spaces: an option there would change the scan).
      - name: Commit range of the event
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          require_sha() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$1 is not a commit SHA: '$2'"; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request)
              require_sha BASE_SHA "$BASE_SHA"
              require_sha HEAD_SHA "$HEAD_SHA"
              range="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              require_sha BEFORE_SHA "$BEFORE_SHA"
              require_sha AFTER_SHA "$AFTER_SHA"
              if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                range="$AFTER_SHA"
              else
                range="$BEFORE_SHA..$AFTER_SHA"
              fi
              ;;
            *)
              echo "::error::unexpected event '$EVENT_NAME'"
              exit 1
              ;;
          esac
          echo "gitleaks range: $range"
          echo "log-opts=$range" >> "$GITHUB_OUTPUT"
      # gitleaks loads a .gitleaksignore by itself, and each fingerprint in it drops a finding: none
      # may be tracked, at any depth nor in any case (on Windows/macOS `.GitLeaksIgnore` is the same
      # file for the hook) (red-zone path, design.md sec. 3.7.2).
      - name: No .gitleaksignore in the repo
        id: no-gitleaksignore
        run: |
          found="$(git ls-files -- ':(glob,icase)**/.gitleaksignore')"
          if [ -n "$found" ]; then
            echo "::error::tracked .gitleaksignore files would silence gitleaks findings:"
            echo "$found"
            exit 1
          fi
      # The global allowlist of the default rules (useDefault, Q-062) never scans these paths, at any
      # depth, so code there would hide a secret. Only the repo's own .gitleaks.toml (red zone,
      # reviewer) and the exact paths of GITLEAKS_EXEMPT_LOCKFILES (scanned by stdin below) may
      # match. The list is every directory/path entry of `[allowlist] paths` of gitleaks
      # v8.30.1, verbatim (config/gitleaks.toml at 83d9cd68, embedded in the pinned image); the
      # file-extension entries (images, fonts, binaries) stay out on purpose (Q-062). A gitleaks test
      # reads the list from the image and fails if this one drifts. Case-insensitive, PCRE (the
      # entries use `(?:` and `(?i)`), NUL-separated so any file name is read as is.
      - name: No tracked files under paths gitleaks skips
        id: no-allowlisted-paths
        run: |
          skipped=(
            'gitleaks\.toml'
            'go\.(?:mod|sum|work(?:\.sum)?)$'
            '(?:^|/)vendor/modules\.txt$'
            '(?:^|/)vendor/(?:github\.com|golang\.org/x|google\.golang\.org|gopkg\.in|istio\.io|k8s\.io|sigs\.k8s\.io)(?:/.*)?$'
            '(?:^|/)gradlew(?:\.bat)?$'
            '(?:^|/)gradle\.lockfile$'
            '(?:^|/)mvnw(?:\.cmd)?$'
            '(?:^|/)\.mvn/wrapper/MavenWrapperDownloader\.java$'
            '(?:^|/)node_modules(?:/.*)?$'
            '(?:^|/)(?:deno\.lock|npm-shrinkwrap\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
            '(?:^|/)bower_components(?:/.*)?$'
            '(?:^|/)(?:angular|bootstrap|jquery(?:-?ui)?|plotly|swagger-?ui)[a-zA-Z0-9.-]*(?:\.min)?\.js(?:\.map)?$'
            '(?:^|/)javascript\.json$'
            '(?:^|/)(?:Pipfile|poetry)\.lock$'
            '(?i)(?:^|/)(?:v?env|virtualenv)/lib(?:64)?(?:/.*)?$'
            '(?i)(?:^|/)(?:lib(?:64)?/python[23](?:\.\d{1,2})+|python/[23](?:\.\d{1,2})+/lib(?:64)?)(?:/.*)?$'
            '(?i)(?:^|/)[a-z0-9_.]+-[0-9.]+\.dist-info(?:/.+)?$'
            '(?:^|/)vendor/(?:bundle|ruby)(?:/.*?)?$'
            'verification-metadata\.xml'
            'Database.refactorlog'
            '(?:^|/)\.git$'
          )
          pattern="$(printf '(?:%s)|' "${skipped[@]}")"
          pattern="${pattern%|}"
          files="$(mktemp)"
          git ls-files -z > "$files"
          # Fail closed: grep exits 1 for "no match", 2 for an error (bad regex, no PCRE).
          status=0
          LC_ALL=C.UTF-8 grep -ziP "$pattern" "$files" > "$files.match" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep failed (exit $status): the path guard did not run"
            exit 1
          fi
          read -r -a exempt <<< "$GITLEAKS_EXEMPT_LOCKFILES"
          allowed=(.gitleaks.toml "${exempt[@]}")
          found=""
          while IFS= read -r -d '' path; do
            keep=1
            for ok in "${allowed[@]}"; do
              if [ "$path" = "$ok" ]; then keep=0; fi
            done
            if [ "$keep" = 1 ]; then found+="$path"$'\n'; fi
          done < "$files.match"
          if [ -n "$found" ]; then
            echo "::error::tracked files that gitleaks never scans (default path allowlist, Q-062):"
            echo "$found"
            exit 1
          fi
      # --ignore-gitleaks-allow: an inline `gitleaks:allow` comment does not silence a finding.
      # --diff-merges=first-parent: `git log -p` prints no diff for a merge, so a file added while
      # merging would go unscanned. --text: a `-diff` attribute or a NUL byte would turn the
      # content into "Binary files differ". --verbose on purpose: without it gitleaks only prints a
      # count, with no rule, file, line or commit to find the leak; --redact keeps the value out.
      - name: gitleaks git
        id: scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" git /repo
          --config /repo/.gitleaks.toml --redact --no-banner --verbose --ignore-gitleaks-allow
          --log-opts="--diff-merges=first-parent --text $LOG_OPTS"
      # The path allowlist never scans the exempted lockfiles in `gitleaks git`, and `gitleaks stdin`
      # has no path, so their diff in the same range goes through stdin. No change in the range:
      # empty input, passes.
      - name: gitleaks stdin on the exempted lockfiles
        id: scan-lockfiles
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          read -r -a exempt <<< "$GITLEAKS_EXEMPT_LOCKFILES"
          for lockfile in "${exempt[@]}"; do
            echo "gitleaks stdin: $lockfile in $LOG_OPTS"
            git log -p --diff-merges=first-parent --text --no-color --no-ext-diff "$LOG_OPTS" -- "$lockfile" \
              | docker run --rm -i -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" stdin \
                --config /repo/.gitleaks.toml --redact --no-banner --verbose --ignore-gitleaks-allow
          done
      - uses: ./.github/actions/setup
        with:
          python: "true"
      # The gitleaks-marked tests run these same steps and the hook against throwaway repos.
      - name: pytest -m gitleaks (AC-PLT-19)
        run: pytest -c scripts/pytest.ini scripts/tests -m gitleaks

  # Step 3 (with `secrets`, T-PLT-04). AC-PLT-26 (RN-PLT-14, D-10): pip-audit over the frozen
  # uv.lock export + pnpm audit; severity from OSV (unknown = high); fails on high/critical without
  # a valid exception in scripts/audit_exceptions.toml, and on any expired exception.
  # No code of the PR runs before the gate (T-PLT-28 review): frontend-deps "false" = only the pnpm
  # binary, no Node and no `pnpm install` (postinstall, .pnpmfile.*; B-2); backend-deps "false" = no
  # `uv sync` and no backend venv (a local build backend planted through uv.lock; B-3). The gate runs
  # in a venv of its own with pip-audit and its whole chain from scripts/audit_tool_requirements.txt
  # (hashed, wheels only), not from the PR's backend/uv.lock.
  deps-audit:
    needs: file-size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # No uv.toml / [tool.uv] of the PR in any uv call of this job, setup-uv's own included (B-5).
      UV_NO_CONFIG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
          node: "true"
          frontend-deps: "false"
          backend-deps: "false"
      - name: Install the pinned audit tools
        # --no-config: no uv.toml / [tool.uv] of the PR (indexes, sources) is read.
        # --no-cache: not the uv cache restored by setup-uv, which other jobs of the run (with PR
        # code) may have written (N-1); every file is downloaded now and checked against its hash.
        run: |
          uv venv --no-config --no-project --python 3.12.16 "$RUNNER_TEMP/audit-tools"
          uv pip install --no-config --no-cache --python "$RUNNER_TEMP/audit-tools/bin/python" \
            --require-hashes --no-build -r scripts/audit_tool_requirements.txt
      - name: audit_deps.py
        # The tools venv's Python runs the script, and pip-audit as `python -I -m pip_audit`.
        run: '"$RUNNER_TEMP/audit-tools/bin/python" scripts/audit_deps.py'

  # Step 4. AC-PLT-21 (backend): mypy with the django-stubs/drf-stubs plugins over backend/ and
  # scripts/, strict in apps/common/ and every domain/ ([tool.mypy] of backend/pyproject.toml). The
  # Django plugin imports config.settings.test, which reads the workflow-level env. AC-PLT-23
  # (ADR-0005): export_openapi --check regenerates the contract from the public URLconf and fails
  # printing the diff if specs/_contracts/openapi.yaml is stale; nothing connects to a service.
  # AC-PLT-23 (frontend, T-PLT-35): frontend/src/types is regenerated from that same committed
  # contract (openapi-typescript, no backend involved) and any difference fails, printing it.
  # AC-PLT-21 (frontend, T-PLT-27): tsc --noEmit in strict mode, against the verified types.
  typecheck:
    needs: [secrets, deps-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
          node: "true"
      - name: mypy
        working-directory: backend
        run: mypy . ../scripts
      - name: export_openapi --check
        working-directory: backend
        run: python manage.py export_openapi --check
      # `git diff` prints changed or deleted files; `git status --porcelain` adds the new ones the
      # generator may write, which `git diff` alone does not see.
      - name: openapi:types + git diff
        working-directory: frontend
        run: |
          pnpm openapi:types
          stale="$(git status --porcelain --untracked-files=all -- src/types)"
          if [ -n "$stale" ]; then
            git --no-pager diff -- src/types
            echo "$stale"
            echo "::error::frontend/src/types is stale: run 'pnpm --dir frontend openapi:types' and commit it"
            exit 1
          fi
      - name: tsc --noEmit
        working-directory: frontend
        run: pnpm typecheck

  # Step 5. AC-PLT-14/15 (RN-PLT-09): constitution rules checked on the AST of apps/ and config/
  # (backend/tests/architecture/): C-09 adapter boundary and C-01 no raw managers in services; C-02
  # joins with T-PLT-20. Fails on a violation or an invalid allowlist entry. Nothing is imported
  # nor connects to a database, so no services. The `tests` job runs these tests again.
  architecture:
    needs: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: pytest tests/architecture
        working-directory: backend
        run: pytest tests/architecture

  # Step 6. Services (T-PLT-11, design.md §8): images by tag + digest (RN-PLT-14; the digest is the
  # multi-arch index of the tag, `docker buildx imagetools inspect`), throwaway test-only
  # credentials matching DATABASE_URL/REDIS_URL. The job starts once both healthchecks pass, so
  # the `integration` tests (AC-PLT-02 /readyz) find them up. pg_isready goes over TCP (-h): during
  # initdb the entrypoint runs a temporary server on the Unix socket only, which a socket probe
  # would report as ready before the real one listens. The Redis probe only counts a real PONG
  # reply (design.md §3.4.1).
  tests:
    needs: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.12-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
          node: "true"
      # Coverage (T-PLT-21): [tool.coverage.run] of backend/pyproject.toml (apps/ + config/, branches,
      # subprocesses). Data and JSON reports go under the git-ignored coverage/ directories; the
      # `coverage` job applies the thresholds of scripts/coverage_thresholds.toml.
      - name: pytest backend (unit + integration)
        working-directory: backend
        run: >-
          pytest --cov --cov-report=json:coverage/backend.json
          --cov-report=term-missing:skip-covered
      - name: pytest scripts/tests
        env:
          COVERAGE_FILE: coverage/.coverage.scripts
        run: >-
          pytest -c scripts/pytest.ini scripts/tests
          --cov=scripts --cov-branch --cov-report=json:coverage/scripts.json
          --cov-report=term-missing:skip-covered
      - name: vitest --coverage
        working-directory: frontend
        run: pnpm test --coverage
      # One artifact, paths kept from the workspace root (their common ancestor), so the
      # `coverage` job restores them where the thresholds file declares them.
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            backend/coverage/backend.json
            coverage/scripts.json
            frontend/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  # Step 7. AC-PLT-22 (RNF-PLT-08, Q-032): backend apps/ + config/ and scripts/ >= 85 % of lines
  # and branches, frontend src/{lib,hooks,modules} >= 70 % of lines; a declared report that is
  # missing fails. Read-only token from the workflow-level `permissions`; the download needs no
  # token (same run).
  coverage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: .
      - name: check_coverage.py
        run: python scripts/check_coverage.py

  # Step 8. AC-PLT-16 (RN-PLT-10, RF-PLT-10): a model change without its migration fails
  # `makemigrations --check --dry-run` (nothing is written). AC-PLT-18: an `NNNN_auto_` name or a
  # RunPython mixed with other operations fails `lint_migrations` (migration files of apps.*, read
  # from disk, no database); AC-PLT-17: so does an irreversible operation (also nested in
  # SeparateDatabaseAndState), and `check_migrations_roundtrip` applies, reverts to zero and
  # reapplies every apps.* app. A PostgreSQL service of its own, same image and credentials as the
  # `tests` job: once an app has models, `makemigrations` also checks the applied history against a
  # real, throwaway database instead of skipping it with a warning, and the round trip runs on it.
  # 00 has no migrations of its own: the job runs anyway, active from the first commit
  # (design.md §3.2.7).
  # The synthetic cases run in the `tests` job (backend/tests/migrations/).
  migrations:
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      # When an app has models, Django checks the applied history against the database, and if it
      # cannot reach it only warns (RuntimeWarning) and goes on. `-W error::RuntimeWarning` turns it
      # into an error even under PYTHONWARNINGS=ignore, and the warning text in the output (a JSON
      # log line through the platform logging) also fails the step: an unreachable service cannot
      # pass as green.
      - name: makemigrations --check --dry-run
        working-directory: backend
        run: |
          output="$RUNNER_TEMP/makemigrations.log"
          status=0
          python -W error::RuntimeWarning manage.py makemigrations --check --dry-run \
            > "$output" 2>&1 || status=$?
          cat "$output"
          if grep -q "consistent migration history" "$output"; then
            echo "::error::makemigrations could not check the migration history against the database"
            exit 1
          fi
          exit "$status"
      - name: lint_migrations
        working-directory: backend
        run: python manage.py lint_migrations
      # C-17: apply -> revert every apps.* app to zero -> reapply, on the fresh PostgreSQL service
      # of this job (throwaway: reverting drops the tables, hence --allow-data-loss). Fails on an
      # irreversible migration.
      - name: check_migrations_roundtrip
        working-directory: backend
        run: python manage.py check_migrations_roundtrip --allow-data-loss

  # Step 9. AC-PLT-25 (RN-PLT-14, RNF-PLT-01, Q-049): the runtime images of backend and frontend,
  # from the frozen lockfiles, tagged with the commit built and never pushed. github.sha is what
  # checkout builds: on a PR that is the merge commit, not the head of the branch. A v* tag that is
  # exactly vX.Y.Z adds that tag too. AC-PLT-29: `runtime` copies from the `builder` stage of
  # frontend/Dockerfile, so that stage runs here, and a sentinel in the client bundle fails its RUN
  # and with it the step. A cache hit only skips a RUN that passed on those same inputs: a failed
  # one exports nothing. Caches go by component so one image does not evict the other's. Buildx
  # runs BuildKit from an image: pinned like the others (tag + digest of the index), though
  # Dependabot does not see this line.
  build:
    needs: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Event values go through env, never into the script text. A ref name is only used as an
      # image tag once it matches vX.Y.Z.
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GIT_SHA is not a commit SHA: '$GIT_SHA'"; exit 1; }
          backend="hub-backend:$GIT_SHA"
          frontend="hub-frontend:$GIT_SHA"
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            backend+=",hub-backend:$REF_NAME"
            frontend+=",hub-frontend:$REF_NAME"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          build-args: GIT_SHA=${{ env.GIT_SHA }}
          tags: ${{ steps.tags.outputs.backend }}
          push: false
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: runtime
          build-args: GIT_SHA=${{ env.GIT_SHA }}
          tags: ${{ steps.tags.outputs.frontend }}
          push: false
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # What the loaded images really are, not what the Dockerfiles say: the same default user and
      # entrypoint the containers start with. Only a positive number passes: empty proves nothing.
      - name: Images carry the commit SHA and do not run as root
        run: |
          for image in "hub-backend:$GIT_SHA" "hub-frontend:$GIT_SHA"; do
            revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            if [ "$revision" != "$GIT_SHA" ]; then
              echo "::error::$image has revision '$revision', expected $GIT_SHA"
              exit 1
            fi
            uid="$(docker run --rm "$image" id -u)"
            if ! [[ "$uid" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$image runs as uid '$uid': it must not be root"
              exit 1
            fi
            echo "$image: revision $revision, uid $uid"
          done
      # The stack of the smoke (T-PLT-38) resolves to these images and no dev one. db and redis keep
      # their own pinned images.
      - name: Compose override names these images
        run: |
          expected="$(printf 'hub-backend:%s\nhub-frontend:%s\n' "$GIT_SHA" "$GIT_SHA")"
          images="$(docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml \
            --env-file env.example config --images | grep -Ev '^(postgres|redis):' | sort -u)"
          if [ "$images" != "$expected" ]; then
            echo "::error::the CI stack runs other images:"
            echo "$images"
            exit 1
          fi
      # AC-PLT-01/02/10/29 on the images above (RF-PLT-07, design.md sec. 3.5). It compares the
      # version with GIT_SHA of this job, never with the head of the branch, and removes the stack
      # with its volumes whatever happens. The runner's python3: the script is standard library only.
      - name: Smoke of the stack
        run: python3 scripts/smoke_stack.py
