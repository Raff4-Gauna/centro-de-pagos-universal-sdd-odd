# CI pipeline (design.md §3.5, RN-PLT-11, RN-PLT-18). Fail-fast chain through `needs:`:
#   lint -> file-size -> secrets + deps-audit -> typecheck -> architecture -> tests -> coverage
#   -> migrations -> build
# It grows one task at a time: each task inserts its job in its place and moves the `needs` of the
# next one (scripts/tests/test_AC_PLT_20_pipeline_chain.py checks the shape on every PR).
# Rules: never pull_request_target nor workflow_run; read-only token; no secrets; every remote
# `uses:` pinned by full SHA (tag in the comment); no job-level `if:` on a required job (a skipped
# required check counts as passed on GitHub).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs of a PR; never cancel a run on main or a tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Common, non-secret env (design.md §3.5). config.settings.test requires these variables (T-PLT-08);
# they are fixed test values, not secrets. DATABASE_URL/REDIS_URL point at the services of the
# `tests` job (T-PLT-11); in the other jobs nothing connects to them.
env:
  TZ: UTC
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
  DATABASE_URL: postgres://hub:hub@localhost:5432/hub
  REDIS_URL: redis://localhost:6379/0

jobs:
  # Step 1. eslint/prettier (T-PLT-27) and check_workflows.py (T-PLT-05) are added here later.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # Step 2. AC-PLT-13: tracked code files over 400 lines (C-14).
  file-size:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: check_file_size.py
        run: python scripts/check_file_size.py

  # Step 3. AC-PLT-19 (RN-PLT-13, C-06): gitleaks over the commits of the event with the repo's
  # .gitleaks.toml, findings redacted. Image by tag + digest (multi-arch index, RN-PLT-14). Range:
  # base..head on a PR, before..after on a push; the whole history of `after` on the first push of
  # a ref (before = 40 zeros) or when `before` is not in the clone. fetch-depth 0 so every commit of
  # the range is there. Then the `gitleaks`-marked tests against the same image. deps-audit
  # (T-PLT-28) joins this stage.
  secrets:
    needs: file-size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Event values go through env, never into the script text. Only 40-hex SHAs reach
      # --log-opts (gitleaks splits it on spaces: an option there would change the scan).
      - name: Commit range of the event
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          require_sha() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$1 is not a commit SHA: '$2'"; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request)
              require_sha BASE_SHA "$BASE_SHA"
              require_sha HEAD_SHA "$HEAD_SHA"
              range="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              require_sha BEFORE_SHA "$BEFORE_SHA"
              require_sha AFTER_SHA "$AFTER_SHA"
              if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                range="$AFTER_SHA"
              else
                range="$BEFORE_SHA..$AFTER_SHA"
              fi
              ;;
            *)
              echo "::error::unexpected event '$EVENT_NAME'"
              exit 1
              ;;
          esac
          echo "gitleaks range: $range"
          echo "log-opts=$range" >> "$GITHUB_OUTPUT"
      - name: gitleaks git
        id: scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" git /repo
          --config /repo/.gitleaks.toml --redact --no-banner --verbose --log-opts="$LOG_OPTS"
      - uses: ./.github/actions/setup
        with:
          python: "true"
      # The gitleaks-marked tests run these same steps and the hook against throwaway repos.
      - name: pytest -m gitleaks (AC-PLT-19)
        run: pytest -c scripts/pytest.ini scripts/tests -m gitleaks

  # Step 4. AC-PLT-21 (backend): mypy with the django-stubs/drf-stubs plugins over backend/ and
  # scripts/, strict in apps/common/ and every domain/ ([tool.mypy] of backend/pyproject.toml). The
  # Django plugin imports config.settings.test, which reads the workflow-level env. tsc --noEmit
  # (T-PLT-27) and the OpenAPI contract/types diff (T-PLT-18, T-PLT-35) are added here later.
  typecheck:
    # Becomes `needs: [secrets, deps-audit]` when T-PLT-28 adds deps-audit to step 3.
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: mypy
        working-directory: backend
        run: mypy . ../scripts

  # Step 5. AC-PLT-14/15 (RN-PLT-09): constitution rules checked on the AST of apps/ and config/
  # (backend/tests/architecture/): C-09 adapter boundary and C-01 no raw managers in services; C-02
  # joins with T-PLT-20. Fails on a violation or an invalid allowlist entry. Nothing is imported
  # nor connects to a database, so no services. The `tests` job runs these tests again.
  architecture:
    needs: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: pytest tests/architecture
        working-directory: backend
        run: pytest tests/architecture

  # Step 6. Services (T-PLT-11, design.md §8): images by tag + digest (RN-PLT-14; the digest is the
  # multi-arch index of the tag, `docker buildx imagetools inspect`), throwaway test-only
  # credentials matching DATABASE_URL/REDIS_URL. The job starts once both healthchecks pass, so
  # the `integration` tests (AC-PLT-02 /readyz) find them up. pg_isready goes over TCP (-h): during
  # initdb the entrypoint runs a temporary server on the Unix socket only, which a socket probe
  # would report as ready before the real one listens. The Redis probe only counts a real PONG
  # reply (design.md §3.4.1).
  tests:
    needs: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.12-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      # Coverage (T-PLT-21): [tool.coverage.run] of backend/pyproject.toml (apps/ + config/, branches,
      # subprocesses). Data and JSON reports go under the git-ignored coverage/ directories; the
      # `coverage` job applies the thresholds of scripts/coverage_thresholds.toml.
      - name: pytest backend (unit + integration)
        working-directory: backend
        run: >-
          pytest --cov --cov-report=json:coverage/backend.json
          --cov-report=term-missing:skip-covered
      - name: pytest scripts/tests
        env:
          COVERAGE_FILE: coverage/.coverage.scripts
        run: >-
          pytest -c scripts/pytest.ini scripts/tests
          --cov=scripts --cov-branch --cov-report=json:coverage/scripts.json
          --cov-report=term-missing:skip-covered
      # One artifact, paths kept from the workspace root (their common ancestor), so the
      # `coverage` job restores them where the thresholds file declares them.
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            backend/coverage/backend.json
            coverage/scripts.json
          if-no-files-found: error
          retention-days: 7

  # Step 7. AC-PLT-22 (RNF-PLT-08, Q-032): backend apps/ + config/ and scripts/ >= 85 % of lines
  # and branches; a declared report that is missing fails. The frontend entry arrives with
  # T-PLT-30. Read-only token from the workflow-level `permissions`; the download needs no token
  # (same run).
  coverage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: .
      - name: check_coverage.py
        run: python scripts/check_coverage.py
