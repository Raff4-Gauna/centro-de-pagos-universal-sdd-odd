# Backend dependencies (uv; Q-030). Exact pins (`==`) from design.md §8, verified 2026-10-31; transitive
# versions live in uv.lock, which CI and images install from with `uv sync --frozen` (C-13, RN-PLT-14).
# Not a package: uv installs the dependencies only, never the project itself.
# Lint/format config lives in the single /ruff.toml at the repo root (no [tool.ruff] here, D-12).
[project]
name = "centro-de-pagos-backend"
version = "0.0.0"
description = "Centro de Pagos Universal - Django + DRF backend"
requires-python = "==3.12.*"
dependencies = [
    "django==5.2.18",
    # 3.18.2 (Q-059, owner review 2026-11-01): fixes three high advisories of 3.16.1. Its stubs
    # stay at 3.16.9 (dev group): the 3.18 stubs need django-stubs>=6, which targets Django 6.
    "djangorestframework==3.18.2",
    # Celery 5.6.3 pulls kombu 5.6.2, which needs redis<6.5 (Q-059).
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "drf-spectacular==0.30.0",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    # django-stubs 5.2.9 requires mypy<1.20.
    "mypy==1.19.1",
    # Pinned so uv does not move to django-stubs 6.x, which targets Django 6.
    "django-stubs==5.2.9",
    # Its companion, pinned for the same reason (unpinned it resolved to 6.x).
    "django-stubs-ext==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "celery-types==0.26.0",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Run from backend/: `pytest`. pytest-django loads these settings before collecting, so the
# variables that config.settings.test requires (DJANGO_SECRET_KEY, DATABASE_URL, REDIS_URL) must be
# in the environment: the CI job sets non-secret test values. Tests that need another settings
# module or environment start Django in a subprocess (tests/conftest.py).
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
# `integration` tests need the PostgreSQL and Redis of DATABASE_URL/REDIS_URL: the CI `tests` job
# services or Compose. Without them: `pytest -m "not integration"`.
markers = [
    "integration: needs the real PostgreSQL and Redis (DATABASE_URL, REDIS_URL)",
]

# Coverage of `pytest --cov` (T-PLT-21, RNF-PLT-08). The gate itself (>= 85 % of lines and branches
# of apps/ + config/) lives in scripts/coverage_thresholds.toml and runs in the CI `coverage` job.
[tool.coverage.run]
source = ["apps", "config"]
branch = true
# Measure the Django processes the tests start (tests/conftest.py run_django); implies `parallel`,
# and pytest-cov combines the per-process files at the end (coverage >= 7.10).
patch = ["subprocess"]
# Data files under coverage/ (git-ignored), next to the JSON report the CI job uploads.
data_file = "coverage/.coverage"

# Type-check (T-PLT-10, RNF-PLT-09, Q-033; design.md §3.2.9). CI `typecheck` job, from backend/:
# `mypy . ../scripts`. config.settings.test needs DJANGO_SECRET_KEY/DATABASE_URL/REDIS_URL in the
# environment (the Django plugin imports the settings); CI sets non-secret test values.
[tool.mypy]
# pydantic.mypy: without it, mypy reads pydantic-settings fields as required __init__ arguments
# (they come from the environment). pydantic is already a runtime dependency (pydantic-settings).
plugins = ["pydantic.mypy", "mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
# Synthetic modules of the tests (AC-PLT-21 here, architecture later): passed explicitly, never
# found by `mypy .`. Matched against the "/"-separated path on every OS.
exclude = ['(^|/)synthetic/']

[tool.django-stubs]
django_settings_module = "config.settings.test"

# `strict = true` is global only in mypy: these are its per-module flags, enumerated (AC-PLT-21).
# The global-only ones (warn_unused_configs, warn_redundant_casts, strict_bytes) cannot be scoped.
[[tool.mypy.overrides]]
module = ["apps.common.*", "apps.*.domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
