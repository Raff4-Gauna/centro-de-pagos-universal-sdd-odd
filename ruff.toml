# Single ruff config for the whole repo: backend/ and scripts/ (design.md §3.6, D-12). Lint + format.
# ruff picks this file from the repo root; backend/pyproject.toml has no [tool.ruff] on purpose.
target-version = "py312"
line-length = 100
# backend/ is the import root of the Django project (pytest `pythonpath = ["."]` there), so `config`
# and `apps` are first-party for isort (T-PLT-08 review O-2).
src = ["backend"]

# Excluded on top of ruff's defaults (.venv, .git, caches, node_modules, ...):
# - context/legacy-source: read-only evidence from the old project, not ours to lint (Q-055, D-13).
#   gitleaks still scans it.
# - frontend/: TypeScript, linted by eslint/prettier. The trailing slash anchors it to the root
#   frontend/ only; a bare "frontend" would also skip e.g. backend/apps/frontend/ (T-PLT-02 review).
# Django migrations are linted and formatted like any module (T-PLT-22, NB-2 of the T-PLT-02 review):
# a data migration (RunPython) is hand-written code, so T20 (no print) and S (bandit) stay active
# there; only the rules that generated code breaks are ignored below.
extend-exclude = ["context/legacy-source", "frontend/"]
# Apply the exclusions even when a file is passed explicitly (pre-commit does that).
force-exclude = true

[format]
# Markdown is out of the formatter: it would rewrite code blocks inside Approved specs (not allowed
# without a change-history entry, AGENTS.md) and a docs-only PR could break the lint job.
exclude = ["*.md"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "T20", # flake8-print: no print, logs go through structlog (RN-PLT-05, AC-PLT-12)
    "DJ",  # flake8-django
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
]

[lint.per-file-ignores]
# Tests: plain `assert` is the point (S101); `test_AC_PLT_12_...` functions and modules carry the
# uppercase AC/RN/RF/C ID required by AGENTS.md (N802, and N999 for modules inside a tests package).
"**/tests/**" = ["S101", "N802", "N999"]
"**/test_*.py" = ["S101", "N802", "N999"]
# scripts/ are CLIs: printing to stdout/stderr is their interface.
"scripts/**" = ["T20"]
# Django migrations: `makemigrations` writes long lines (E501) and class-level `dependencies` and
# `operations` lists (RUF012); a RunPython function binds models as `Model = apps.get_model(...)`
# (N806). Nothing else is waived: T20 and S keep applying. (ruff's N999 already skips
# `0001_initial`-style names inside a `migrations/` package.) Only `NNNN_*.py` modules: a bare
# `**/migrations/*.py` would also waive them in backend/tests/migrations/ (tests, conftest).
"**/migrations/[0-9][0-9][0-9][0-9]_*.py" = ["E501", "RUF012", "N806"]
