# Single ruff config for the whole repo: backend/ and scripts/ (design.md §3.6, D-12). Lint + format.
# ruff picks this file from the repo root; backend/pyproject.toml has no [tool.ruff] on purpose.
target-version = "py312"
line-length = 100

# Excluded on top of ruff's defaults (.venv, .git, caches, node_modules, ...):
# - context/legacy-source: read-only evidence from the old project, not ours to lint (Q-055, D-13).
#   gitleaks still scans it.
# - **/migrations: generated by Django; checked by the migrations job instead.
# - frontend: TypeScript, linted by eslint/prettier.
extend-exclude = ["context/legacy-source", "**/migrations", "frontend"]
# Apply the exclusions even when a file is passed explicitly (pre-commit does that).
force-exclude = true

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "T20", # flake8-print: no print, logs go through structlog (RN-PLT-05, AC-PLT-12)
    "DJ",  # flake8-django
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
]

[lint.per-file-ignores]
# Tests: plain `assert` is the point (S101); `test_AC_PLT_12_...` names carry the uppercase AC ID
# required by AGENTS.md (N802).
"**/tests/**" = ["S101", "N802"]
"**/test_*.py" = ["S101", "N802"]
# scripts/ are CLIs: printing to stdout/stderr is their interface.
"scripts/**" = ["T20"]
